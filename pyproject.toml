[project]
name = "holdpoint"
version = "0.1.0"
description = "Hold Point: a voice-first assistant for blind and low-vision people that verifies appliance states and abstains when it can't see."
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "opencv-python-headless>=4.9",
  "pydantic>=2.6",
  "openai>=1.40",
  "meta-sam-parser>=0.1",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools]
packages = ["holdpoint"]

[tool.setuptools.package-data]
holdpoint = ["static/*"]
