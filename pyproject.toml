[project]
name = "holdpoint"
version = "0.1.0"
description = "Hold Point: a voice-first assistant for blind and low-vision people that verifies appliance states and abstains when it can't see."
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "opencv-python-headless>=4.9",
  "pydantic>=2.6",
  "openai>=1.40",
  "meta-sam-parser>=0.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools]
packages = ["holdpoint"]
